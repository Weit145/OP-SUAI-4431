[project]
name = "vegetation-classification"
version = "2.0.0"
description = "Classification of Sentinel-2 imagery using spectral indices"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=10.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "streamlit>=1.37",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
