[project]
name = "vegetation-classification"
version = "3.0.0"
description = "FastAPI service for Sentinel-2 vegetation and land-cover classification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "matplotlib>=3.10,<4.0",
    "numpy>=2.2,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "rasterio>=1.4,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
