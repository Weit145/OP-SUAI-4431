<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — аренда недвижимости</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card narrow">
    <a th:href="@{/}">← К списку объектов</a>
    <h1>Вход</h1>
    <p th:if="${param.error}" class="error">Неверный логин или пароль.</p>
    <form th:action="@{/login}" method="post">
        <label>Логин <input name="login" autocomplete="username" required></label>
        <label>Пароль <input type="password" name="pass" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
