databaseChangeLog:
  - changeSet:
      id: create-property-table
      author: student
      changes:
        - createTable:
            tableName: property
            columns:
              - column:
                  name: property_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: property_pkey
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: property_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: area
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: rooms
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: monthly_rent
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
  - changeSet:
      id: create-users-and-audit
      author: student
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: pass_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - createTable:
            tableName: audit_event
            columns:
              - column:
                  name: audit_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: property_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
